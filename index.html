
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meme Sound Hub</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #090d18;
  color: white;
}

header {
  padding: 22px 15px;
  text-align: center;
  background: #111a2d;
  border-bottom: 2px solid #00e5ff;
}

header h1 {
  color: #00e5ff;
  font-size: 30px;
}

header p {
  color: #aaa;
  margin-top: 8px;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.search {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #00e5ff;
  background: #151e30;
  color: white;
  font-size: 16px;
  outline: none;
  margin-bottom: 20px;
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  margin-bottom: 25px;
}

.categories button {
  padding: 10px 18px;
  background: #17243b;
  color: white;
  border: 1px solid #00e5ff;
  border-radius: 20px;
  white-space: nowrap;
  cursor: pointer;
}

.categories button.active {
  background: #00bcd4;
  color: #001018;
}

h2 {
  margin-bottom: 18px;
}

.sound-card {
  background: #141e32;
  border: 1px solid #263c58;
  border-radius: 15px;
  padding: 17px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.sound-info h3 {
  font-size: 17px;
}

.sound-info p {
  color: #aaa;
  font-size: 12px;
  margin-top: 6px;
}

.actions {
  display: flex;
  gap: 8px;
}

.actions button, .download {
  border: none;
  padding: 10px 13px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: bold;
}

.play {
  background: #00d9ff;
  color: black;
}

.download {
  background: #21d47b;
  color: black;
  text-decoration: none;
  font-size: 13px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #888;
}
</style>
</head>

<body>

<header>
  <h1>😂 MEME SOUND HUB</h1>
  <p>Find • Listen • Download</p>
</header>

<div class="container">

<input
  type="text"
  id="search"
  class="search"
  placeholder="🔍 Search meme sounds..."
>

<div class="categories">
  <button class="active" data-category="All">All</button>
  <button data-category="Funny">Funny</button>
  <button data-category="Viral">Viral</button>
  <button data-category="Reaction">Reaction</button>
  <button data-category="Music">Music</button>
</div>

<h2>🔥 Popular Meme Sounds</h2>

<div id="soundList"></div>

</div>

<footer>
  © 2026 Meme Sound Hub | All Rights Reserved
</footer>

<script>

// Add your own licensed MP3 files here
const sounds = [
  {
    name: "Funny Sound 1",
    category: "Funny",
    file: "sounds/funny1.mp3"
  },
  {
    name: "Funny Sound 2",
    category: "Funny",
    file: "sounds/funny2.mp3"
  },
  {
    name: "Viral Sound 1",
    category: "Viral",
    file: "sounds/viral1.mp3"
  },
  {
    name: "Reaction Sound 1",
    category: "Reaction",
    file: "sounds/reaction1.mp3"
  },
  {
    name: "Music Sound 1",
    category: "Music",
    file: "sounds/music1.mp3"
  }
];

let currentCategory = "All";
let currentAudio = null;
let currentButton = null;

const list = document.getElementById("soundList");

function renderSounds() {
  const search = document.getElementById("search")
    .value.toLowerCase();

  const filtered = sounds.filter(sound =>
    sound.name.toLowerCase().includes(search) &&
    (currentCategory === "All" ||
     sound.category === currentCategory)
  );

  list.innerHTML = "";

  filtered.forEach(sound => {
    const card = document.createElement("div");
    card.className = "sound-card";

    const info = document.createElement("div");
    info.className = "sound-info";

    const title = document.createElement("h3");
    title.textContent = "🎵 " + sound.name;

    const category = document.createElement("p");
    category.textContent = sound.category;

    info.append(title, category);

    const actions = document.createElement("div");
    actions.className = "actions";

    const play = document.createElement("button");
    play.className = "play";
    play.textContent = "▶ Play";

    play.onclick = () => {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        if (currentButton) currentButton.textContent = "▶ Play";
      }

      if (currentButton === play) {
        currentAudio = null;
        currentButton = null;
        return;
      }

      currentAudio = new Audio(sound.file);
      currentButton = play;
      play.textContent = "⏸ Pause";

      currentAudio.play().catch(() => {
        play.textContent = "▶ Play";
        alert("Audio file nahi mila. MP3 upload karo!");
        currentAudio = null;
        currentButton = null;
      });

      currentAudio.onended = () => {
        play.textContent = "▶ Play";
        currentAudio = null;
        currentButton = null;
      };
    };

    const download = document.createElement("a");
    download.className = "download";
    download.textContent = "⬇ Download";
    download.href = sound.file;
    download.download = sound.name + ".mp3";

    actions.append(play, download);
    card.append(info, actions);
    list.appendChild(card);
  });

  if (!filtered.length) {
    list.textContent = "No sounds found!";
  }
}

document.getElementById("search")
  .addEventListener("input", renderSounds);

document.querySelectorAll(".categories button")
  .forEach(button => {
    button.onclick = () => {
      document.querySelector(".categories .active")
        .classList.remove("active");

      button.classList.add("active");
      currentCategory = button.dataset.category;
      renderSounds();
    };
  });

renderSounds();

</script>
</body>
</html>
